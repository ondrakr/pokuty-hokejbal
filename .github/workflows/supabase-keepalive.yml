name: Supabase keepalive

on:
  schedule:
    # Třikrát denně — Free projekt se pauzne po ~7 dnech bez DB aktivity.
    - cron: '0 5,13,21 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app (hits Supabase)
        run: |
          set -euo pipefail
          curl -fsS "https://pokuty-hokejbal.vercel.app/api/keepalive"
          echo
          echo "OK"
